<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Insurance Check</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:ital,wght@0,500;0,600;0,700;0,800;1,500&display=swap">
<style>
/* Layout: heart-topped header, search + filter chips, card grid; click a card to open its detail sheet */
:root{
  --bg:#fff6f8; --surface:#ffffff; --tint:#ffe8ef; --fg:#3a2230; --muted:#735161; --line:#f0c2d1;
  --accent:#b0245a; --accent-ink:#ffffff; --plum:#7b3f9e; --heart:#f7b9cc;
  --ok:#1f7a4d; --ok-bg:#e3f4ea; --warn:#9a5b00; --warn-bg:#fff1d6; --no:#b3261e; --no-bg:#fde4e2; --unk:#5f5a66; --unk-bg:#eeebf1;
  --display:'Fredoka',Nunito,system-ui,sans-serif; --body:'Nunito',system-ui,sans-serif;
  --shadow:0 1px 2px rgba(122,40,76,.08),0 6px 18px rgba(122,40,76,.07);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#1e1318; --surface:#2a1b22; --tint:#351f2a; --fg:#f8e8ee; --muted:#cfb0bd; --line:#553041;
  --accent:#ff86b0; --accent-ink:#2a0c19; --plum:#cfa0ec; --heart:#6b3048;
  --ok:#7ddba8; --ok-bg:#173327; --warn:#f3c56b; --warn-bg:#3a2c12; --no:#ff9d95; --no-bg:#3d1a19; --unk:#c9c2d2; --unk-bg:#2f2a36;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 18px rgba(0,0,0,.25); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#1e1318; --surface:#2a1b22; --tint:#351f2a; --fg:#f8e8ee; --muted:#cfb0bd; --line:#553041;
  --accent:#ff86b0; --accent-ink:#2a0c19; --plum:#cfa0ec; --heart:#6b3048;
  --ok:#7ddba8; --ok-bg:#173327; --warn:#f3c56b; --warn-bg:#3a2c12; --no:#ff9d95; --no-bg:#3d1a19; --unk:#c9c2d2; --unk-bg:#2f2a36;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 18px rgba(0,0,0,.25); color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.45}
.wrap{max-width:1100px;margin:0 auto;padding:28px 20px 60px;display:flex;flex-direction:column;gap:18px}
.heart{display:inline-block;flex-shrink:0}
header{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:12px}
header::before{content:""}
.brand{display:flex;flex-direction:column;align-items:center;gap:2px;text-align:center;min-width:0}
.title-row{display:flex;align-items:center;justify-content:center;gap:10px}
@media (max-width:620px){header{grid-template-columns:minmax(0,1fr)}header::before{display:none}header #addBtn{justify-self:center}}
h1{font-family:var(--display);font-weight:700;font-size:clamp(26px,5vw,34px);margin:0;color:var(--accent);text-wrap:balance}
.sub{font-family:var(--display);font-weight:500;color:var(--muted);font-size:14px;letter-spacing:.4px}
button{font:inherit;cursor:pointer}
.btn{border:0;border-radius:99px;padding:10px 18px;font-weight:800;background:var(--accent);color:var(--accent-ink);display:inline-flex;align-items:center;gap:6px;min-height:44px}
.btn.ghost{background:transparent;color:var(--accent);border:2px solid var(--accent)}
.btn.danger{background:var(--no);color:var(--surface)}
.btn:focus-visible,.chip:focus-visible,.card:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--plum);outline-offset:2px}
.tip{background:var(--tint);border-radius:16px;padding:10px 16px;display:flex;gap:10px;align-items:flex-start;color:var(--fg);font-size:14px}
.tools{display:flex;flex-direction:column;gap:10px}
.search{position:relative}
.search input{width:100%;border:2px solid var(--line);background:var(--surface);color:var(--fg);border-radius:99px;padding:12px 18px 12px 44px;font:inherit;font-size:16px}
.search svg{position:absolute;left:16px;top:50%;transform:translateY(-50%)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1.5px solid var(--line);background:var(--surface);color:var(--fg);border-radius:99px;padding:6px 14px;font-weight:700;font-size:14px;min-height:36px}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.count{color:var(--muted);font-size:14px;font-weight:600}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.card{background:var(--surface);border:1.5px solid var(--line);border-radius:18px;padding:14px 16px;text-align:left;color:var(--fg);display:flex;flex-direction:column;gap:8px;box-shadow:var(--shadow);transition:transform .12s ease,border-color .12s ease;min-width:0}
.card:hover{transform:translateY(-2px);border-color:var(--accent)}
.card .name{font-family:var(--display);font-weight:600;font-size:18px;line-height:1.2;overflow-wrap:anywhere}
.card .type{color:var(--muted);font-size:13px;font-weight:700}
.pills{display:flex;flex-wrap:wrap;gap:6px}
.pill{display:inline-flex;align-items:center;gap:5px;border-radius:99px;padding:2px 10px;font-size:12.5px;font-weight:800}
.pill .dot{width:7px;height:7px;border-radius:50%;background:currentColor}
.s-accepted{background:var(--ok-bg);color:var(--ok)} .s-check{background:var(--warn-bg);color:var(--warn)}
.s-not{background:var(--no-bg);color:var(--no)} .s-unknown{background:var(--unk-bg);color:var(--unk)}
.ref{background:var(--tint);color:var(--plum)}
.medicaid{background:var(--ok-bg);color:var(--ok);border:2px solid var(--ok);border-radius:14px;padding:10px 14px;font-weight:800;display:flex;gap:10px;align-items:center}
.pill.concern{background:var(--warn-bg);color:var(--warn)}
.concern-box{background:var(--warn-bg);color:var(--warn);border:2px solid var(--warn);border-radius:14px;padding:10px 14px;font-weight:800;display:flex;gap:10px;align-items:center}
label.check{display:flex;align-items:center;gap:10px;font-size:14px;color:var(--fg);cursor:pointer}
label.check input{width:22px;height:22px;min-height:0;accent-color:var(--accent)}
.fact .v{line-height:1.4}
.pill.mcd{background:var(--ok-bg);color:var(--ok)}
.empty{background:var(--surface);border:2px dashed var(--line);border-radius:18px;padding:30px 20px;text-align:center;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:10px}
.status-line{color:var(--muted);font-size:13px;min-height:18px}
/* sheet */
.overlay{position:fixed;inset:0;background:rgba(40,10,24,.45);display:flex;justify-content:center;align-items:flex-start;padding:max(24px,env(safe-area-inset-top,0px)) 16px 24px;overflow-y:auto;z-index:10}
.sheet{background:var(--surface);color:var(--fg);border-radius:22px;width:100%;max-width:620px;padding:22px;display:flex;flex-direction:column;gap:16px;box-shadow:0 20px 50px rgba(0,0,0,.25);position:relative}
.sheet h2{font-family:var(--display);font-size:26px;margin:0;color:var(--accent);line-height:1.15;overflow-wrap:anywhere;padding-right:44px}
.close{position:absolute;right:14px;top:14px;border:0;background:var(--tint);color:var(--accent);width:40px;height:40px;border-radius:50%;font-size:22px;line-height:1;display:grid;place-items:center}
.facts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.fact{background:var(--bg);border-radius:14px;padding:10px 12px;min-width:0}
.fact .k{font-size:11.5px;font-weight:800;letter-spacing:.8px;text-transform:uppercase;color:var(--muted)}
.fact .v{font-weight:700;font-size:16px;overflow-wrap:anywhere;white-space:pre-wrap;font-variant-numeric:tabular-nums}
.fact.wide{grid-column:span 2}
.fact .v.blank{color:var(--muted);font-weight:600;font-style:italic}
.meta{color:var(--muted);font-size:13px}
.actions{display:flex;flex-wrap:wrap;gap:10px;justify-content:flex-end}
form{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field.wide{grid-column:span 2}
label{font-size:12.5px;font-weight:800;color:var(--muted);letter-spacing:.4px}
input,select,textarea{font:inherit;color:var(--fg);background:var(--bg);border:1.5px solid var(--line);border-radius:12px;padding:9px 12px;min-height:44px;width:100%}
textarea{min-height:80px;resize:vertical}
.confirm{background:var(--no-bg);color:var(--no);border-radius:14px;padding:12px;display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;font-weight:700}
.err{color:var(--no);font-weight:700;font-size:14px}
@media (max-width:520px){.facts,form{grid-template-columns:minmax(0,1fr)}.fact.wide,.field.wide{grid-column:auto}}
@media (prefers-reduced-motion:reduce){.card{transition:none}.card:hover{transform:none}}
</style>
<style>body{margin:0}[hidden]{display:none!important}</style>
</head>
<body>

<div class="wrap">
  <header>
    <div class="brand">
      <div class="title-row">
        <svg class="heart" width="34" height="34" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21s-7.5-4.6-9.8-9C.4 8.3 2.8 4 6.8 4c2.2 0 3.7 1.2 5.2 3 1.5-1.8 3-3 5.2-3 4 0 6.4 4.3 4.6 8-2.3 4.4-9.8 9-9.8 9z" fill="var(--accent)"/></svg>
        <h1>Insurance Check</h1>
      </div>
      <div class="sub">Bucks Mont Eye Associates · FRONT DESK GIRLS</div>
    </div>
  </header>

  <div class="tip">
    <svg class="heart" width="18" height="18" viewBox="0 0 24 24" aria-hidden="true" style="margin-top:2px"><path d="M12 21s-7.5-4.6-9.8-9C.4 8.3 2.8 4 6.8 4c2.2 0 3.7 1.2 5.2 3 1.5-1.8 3-3 5.2-3 4 0 6.4 4.3 4.6 8-2.3 4.4-9.8 9-9.8 9z" fill="var(--accent)"/></svg>
    <div>Insurance is hard! Use this as a guide and always verify eligibility.</div>
  </div>

  <div class="tools">
    <div class="search">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="var(--muted)" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="q" type="search" placeholder="Search insurance or doctor name…" aria-label="Search insurances or doctors" autocomplete="off">
    </div>
    <div class="chips" id="typeChips" role="group" aria-label="Filter by plan type"></div>
  </div>

  <div class="count" id="count"></div>
  <div class="grid" id="grid"></div>
  <div class="empty" id="empty" hidden></div>
  <div class="status-line" id="statusLine"></div>
</div>

<div class="overlay" id="overlay" hidden>
  <div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle"></div>
</div>

<script>
(() => {
const HEART = 'M12 21s-7.5-4.6-9.8-9C.4 8.3 2.8 4 6.8 4c2.2 0 3.7 1.2 5.2 3 1.5-1.8 3-3 5.2-3 4 0 6.4 4.3 4.6 8-2.3 4.4-9.8 9-9.8 9z';
const STATUS = {accepted:'We take it', check:'Depends on plan', not:'We don’t take it', unknown:'Needs checking'};
const REFERRAL = {yes:'Referral needed', no:'No referral', depends:'Referral: check the card', unknown:'Referral: not listed'};
const TYPES = ['Commercial','Medicare Advantage','Medicaid','Non-traditional','Workers comp','Other'];
const FIELDS = [
  ['refraction','Refraction fee?','Yes / No'],
  ['copay','Specialist copay','e.g. $40'],
  ['deductible','Deductible','e.g. $500 / applies to medical'],
  ['coinsurance','Coinsurance','e.g. 20% after deductible'],
  ['auth','Prior auth','e.g. Needed for surgery'],
];
let items = [], db = null, col = null;
let fStatus = 'all', fType = 'all', query = '';
const $ = id => document.getElementById(id);

function el(tag, attrs = {}, kids = []) {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k === 'class') e.className = v; else if (k === 'text') e.textContent = v;
    else if (k.startsWith('on')) e.addEventListener(k.slice(2), v); else e.setAttribute(k, v);
  }
  for (const c of [].concat(kids)) if (c) e.append(c);
  return e;
}
function heart(size, fill) {
  const ns = 'http://www.w3.org/2000/svg';
  const s = document.createElementNS(ns, 'svg'); s.setAttribute('width', size); s.setAttribute('height', size);
  s.setAttribute('viewBox', '0 0 24 24'); s.setAttribute('aria-hidden', 'true'); s.classList.add('heart');
  const p = document.createElementNS(ns, 'path'); p.setAttribute('d', HEART); p.setAttribute('fill', fill); s.append(p); return s;
}
const str = v => (typeof v === 'string' ? v : '');
const statusOf = d => STATUS[d.status] ? d.status : 'unknown';
function isMedicaid(d){ return str(d.type)==='Medicaid'; }
function statusPill(d){ const s = statusOf(d); return el('span',{class:'pill s-'+s},[el('span',{class:'dot'}), STATUS[s]]); }
function isConcern(d){ return d.concern==='yes'; }
function refPillMaybe(d){ return (REFERRAL[d.referral] && d.referral!=='unknown') ? refPill(d) : null; }
function refPill(d){ const r = REFERRAL[d.referral] ? d.referral : 'unknown'; return el('span',{class:'pill ref'},[REFERRAL[r]]); }

function renderChips() {
  const tc = $('typeChips'); tc.replaceChildren();
  [['all','All plan types'],...TYPES.map(t=>[t,t])].forEach(([k,label]) => tc.append(
    el('button',{class:'chip',type:'button','aria-pressed':String(fType===k),onclick:()=>{fType=k;renderChips();render();}},[label])));
}

function render() {
  const q = query.trim().toLowerCase();
  const list = items.filter(d =>
    (fType==='all' || str(d.type)===fType) &&
    (!q || str(d.name).toLowerCase().includes(q) || str(d.notes).toLowerCase().includes(q) || str(d.doctors).toLowerCase().includes(q) || str(d.doctorsOON).toLowerCase().includes(q) || str(d.rules).toLowerCase().includes(q)))
    .sort((a,b)=>str(a.name).localeCompare(str(b.name)));
  const grid = $('grid'); grid.replaceChildren();
  list.forEach(d => grid.append(el('button',{class:'card',type:'button',onclick:()=>openDetail(d.id)},[
    el('div',{class:'name',text:str(d.name)||'Unnamed insurance'}),
    el('div',{class:'type',text:str(d.type)||'Plan type not set'}),
    el('div',{class:'pills'},[isConcern(d)?el('span',{class:'pill concern',text:'Extra attention'}):null, isMedicaid(d)?el('span',{class:'pill mcd',text:'$0 out of pocket'}):null, refPillMaybe(d)])
  ])));
  $('count').textContent = items.length ? `Showing ${list.length} of ${items.length} insurances` : '';
  const empty = $('empty');
  if (!items.length) {
    empty.hidden = false;
    empty.replaceChildren(heart(32,'var(--heart)'), el('div',{text:'No insurances listed yet.'}));
  } else if (items.length && !list.length) {
    empty.hidden = false;
    empty.replaceChildren(heart(28,'var(--heart)'), el('div',{text:'No insurance matches that search. Check the spelling or try another word.'}));
  } else empty.hidden = true;
}

function appendAll(p,...kids){ kids.forEach(c=>{ if(c) p.append(c); }); }
function openSheet(){ $('overlay').hidden = false; document.body.style.overflow='hidden'; }
function closeSheet(){ $('overlay').hidden = true; document.body.style.overflow=''; }
$('overlay').addEventListener('click', e => { if (e.target.id === 'overlay') closeSheet(); });
$('overlay').addEventListener('keydown', e => { if (e.key === 'Escape') closeSheet(); });

function fmtDate(v){ if(!v) return ''; const d=new Date(v); return isNaN(d)?'':d.toLocaleDateString(undefined,{month:'short',day:'numeric',year:'numeric'}); }

function openDetail(id) {
  const d = items.find(x=>x.id===id); if (!d) return;
  const sheet = $('sheet'); sheet.replaceChildren();
  const fact = (k, v, wide) => el('div',{class:'fact'+(wide?' wide':'')},[
    el('div',{class:'k',text:k}), el('div',{class:'v'+(v?'':' blank'),text:v||'Not added yet'})]);
  appendAll(sheet,
    el('button',{class:'close',type:'button','aria-label':'Close',onclick:closeSheet},['×']),
    el('h2',{id:'sheetTitle',text:str(d.name)||'Unnamed insurance'}),
    el('div',{class:'pills'},[refPillMaybe(d), str(d.type)?el('span',{class:'pill s-unknown',text:d.type}):null]),
    isConcern(d) ? el('div',{class:'concern-box',role:'note'},[heart(20,'currentColor'), el('span',{text:'Biggest concern: pay extra attention. If anything is confusing, transfer the call to the clinic.'})]) : null,
    isMedicaid(d) ? el('div',{class:'medicaid',role:'note'},[heart(20,'currentColor'), el('span',{text:'This is Medicaid. Do not charge the patient anything out of pocket (no copay, no deductible, no coinsurance). The only exception is contact lens appointments.'})]) : null,
    el('div',{class:'facts'},[
      fact('Doctors in network',str(d.doctors)),
      fact('Doctors out of network',str(d.doctorsOON)),
      fact('Rules / caveats',str(d.rules),true),
      ...FIELDS.filter(([k])=>k==='refraction'||str(d[k])).map(([k,label])=>fact(label,str(d[k]))),
      fact('Notes',str(d.notes),true)
    ]),
    el('div',{class:'meta',text: d.updatedAt ? 'Last updated '+fmtDate(d.updatedAt) : ''}),
    el('div',{class:'actions'},[
      el('button',{class:'btn ghost',type:'button',onclick:closeSheet},['Close'])
    ])
  );
  openSheet(); sheet.querySelector('.close').focus();
}

let flashT; function flash(msg){ $('statusLine').textContent = msg; clearTimeout(flashT); flashT=setTimeout(()=>{$('statusLine').textContent='';},2500); }

$('q').addEventListener('input', e => { query = e.target.value; render(); });
renderChips(); render();

items = [{"concern": "", "doctors": "ALL", "doctorsOON": "None", "name": "Aetna (DAE)", "notes": "Special vision plan under Aetna medical.", "referral": "unknown", "refraction": "No", "rules": "Some Aetna plans have a DAE exception. This means that they have a special vision benefit that covers them even though they may not have a medical dx. We can check this on availity under the \"optical\" benefit. They can still be covered under this DAE with no copay if they have up to 2 medical dx's. If they have more than 2, they will have to pay their copay.", "type": "Other", "updatedAt": "2026-09-30T19:50:00Z", "id": "aetna-dae"}, {"concern": "", "doctors": "ALL", "doctorsOON": "None", "name": "Aetna HMO", "notes": "", "referral": "depends", "refraction": "No", "rules": "COULD require referral. We would need to check the back of the card to see if it says \"specialist requires referral\".", "type": "Commercial", "updatedAt": "2026-09-30T19:50:00Z", "id": "aetna-hmo"}, {"concern": "", "doctors": "N/A", "doctorsOON": "N/A", "name": "ALL BCBS Plans", "notes": "", "referral": "unknown", "refraction": "No", "rules": "Please check the back of the card to see if it says \"bill to local\". If that is the case, you will tag it under \"Highmark Blue Shield\". If it does not say this, and it says something about billing under the specific state, you will tag it under \"Independence PPO\".", "type": "Other", "updatedAt": "2026-09-30T19:50:00Z", "id": "all-bcbs-plans"}, {"concern": "yes", "doctors": "ALL but SDT", "doctorsOON": "Dr. Tubiello", "name": "Amerihealth Caritas", "notes": "", "referral": "unknown", "refraction": "No", "rules": "Must be validated at time appt is booked and at time of visit. Pt cannot be seen without PROVEN med dx. Cannot bill OOP except for Contact Lens appts", "type": "Medicaid", "updatedAt": "2026-09-30T19:50:00Z", "id": "amerihealth-caritas"}, {"concern": "yes", "doctors": "None", "doctorsOON": "ALL", "name": "Capitol Blue Cross St Lukes", "notes": "There are many of our patients that this affects.", "referral": "unknown", "refraction": "No", "rules": "ID cards that start with SUE are St Lukes and we are OON. The pt can get an exception letter but it is not guaranteed that they will receive it or that it will be covered.", "type": "Commercial", "updatedAt": "2026-09-30T19:50:00Z", "id": "capitol-blue-cross-st-lukes"}, {"concern": "yes", "doctors": "ALL", "doctorsOON": "None", "name": "Devoted", "notes": "", "referral": "unknown", "refraction": "No", "rules": "Gets tagged as \"Premier\" in NextGen", "type": "Commercial", "updatedAt": "2026-09-30T19:50:00Z", "id": "devoted"}, {"concern": "yes", "doctors": "ALL OD's (except Dr. Tubiello)", "doctorsOON": "Dr. Tubiello, NO MD's", "name": "Geisinger (kids/CHIP/Medicaid)", "notes": "", "referral": "unknown", "refraction": "No", "rules": "Must be validated at time appt is booked and at time of visit. Pt cannot be seen without PROVEN med dx. Cannot bill OOP except for Contact Lens appts", "type": "Medicaid", "updatedAt": "2026-09-30T19:50:00Z", "id": "geisinger-kids-chip-medicaid"}, {"concern": "", "doctors": "ALL", "doctorsOON": "None", "name": "Highmark Federal Blue Shield", "notes": "", "referral": "unknown", "refraction": "Yes", "rules": "Usually has a copay and does not cover refractions. This can be a primary or secondary. If it is a secondary, you would not collect the copay.", "type": "Commercial", "updatedAt": "2026-09-30T19:50:00Z", "id": "highmark-federal-blue-shield"}, {"concern": "", "doctors": "ALL", "doctorsOON": "None", "name": "Independence Personal Choice 65", "notes": "", "referral": "unknown", "refraction": "No", "rules": "Often confused with Independence Personal Choice and tagged under the wrong package. This insurance has its own package. This should NOT get tagged under \"Independence PPO\" or \"Highmark\" Blue Shield.", "type": "Medicare Advantage", "updatedAt": "2026-09-30T19:50:00Z", "id": "independence-personal-choice-65"}, {"concern": "", "doctor  at time appt is booked and at time of visit. Pt cannot be seen without PROVEN med dx. Cannot bill OOP except for Contact Lens appts. CAN ONLY SEE MD's", "type": "Medicaid", "updatedAt": "2026-09-30T19:50:00Z", "id": "upmc-community-health-choices"}, {"concern": "yes", "doctors": "Only if we are on the panel", "doctorsOON": "Only if we are on the panel", "name": "Workers Comp", "notes": "For work-related injuries connected to a claim with the employer's insurance carrier. These patients CANNOT be scheduled without the workers comp information ahead of time, and without knowing whether or not we are on the panel.", "referral": "unknown", "refraction": "No", "rules": "Workers comp insurances are added in under \"Workers Comp\" in NextGen. We would then add the name and address of the employer to the insurance detail box that is provided. Then we would add the name of the insurance carrier to the \"group name\" along with the address of the insurance carrier, and the claim number under the policy ID. We can add the claims adjuster as the contact. If we do not have the insurance carrier and the billing address, it will NOT get billed. Pt may pay OOP if they so choose, but we CANNOT use their personal insurance", "type": "Workers comp", "updatedAt": "2026-09-30T19:50:00Z", "id": "workers-comp"}];
